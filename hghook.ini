;Haegemonia widescreen mod tweaks

[Text]
; line height factor (0.85 = original ink vs v-rect padding)
LineFactor=0.85
; extra advance per glyph, design px
LetterSpacing=1.0
; advance of the space character, design px
WordSpacing=6.0

[Cursor]
CursorScale=0.5

[Icons]
; map icons + slider scale about their center
IconScale=0.66

[MapLabels]
OverlappingLabels=1

[QoL]
QoLFeaturesEnabled=1

[RotationSmooth]
RotationSmoothEnabled=1
RotationBoost=3.2
RotationSens=0.025